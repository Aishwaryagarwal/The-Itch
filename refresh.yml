name: refresh jobs

on:
  schedule:
    - cron: '0 9 * * 1-5'      # 09:00 UTC, weekday mornings
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch open roles
        run: python ingest.py --out jobs.json --max-age 30 --no-phd

      - name: Commit if changed
        run: |
          git config user.name  "nextgig-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json watchlist.json data/history.json
          git diff --staged --quiet || git commit -m "refresh $(date -u +%F)"
          git push
