name: refresh jobs

on:
  schedule:
    - cron: '0 9 * * 1-5'      # 09:00 UTC, weekday mornings
  workflow_dispatch:            # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch open roles
        run: python ingest.py --max-age 30 --no-phd

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "nextgig-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new today."
          else
            git commit -m "refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Cloudflare Pages normally redeploys on its own when the push above lands.
      # This step is a safety net: if you add a CF_DEPLOY_HOOK secret it will
      # also poke Cloudflare directly. Without the secret it quietly does nothing.
      - name: Nudge Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -sS -X POST "$HOOK" && echo "deploy hook sent"
