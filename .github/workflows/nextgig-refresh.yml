name: nextgig refresh

# Workflows only run from .github/workflows/ at the repository root, so this
# lives here rather than beside the project it drives. The paths below reach
# into job-market/nextgig/; the scripts resolve their own data and output
# directories, so there is no working-directory juggling to do.

on:
  schedule:
    - cron: '0 9 * * 1'        # 09:00 UTC every Monday — once a week
  workflow_dispatch:            # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: nextgig-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: job-market/nextgig/requirements.txt

      - run: pip install -r job-market/nextgig/requirements.txt

      - name: Fetch open roles
        run: python job-market/nextgig/scripts/ingest.py --max-age 30 --no-phd

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "nextgig-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A job-market/nextgig
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new today."
          else
            git commit -m "nextgig: refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Cloudflare Pages normally redeploys on its own when the push above lands.
      # This step is a safety net: if you add a CF_DEPLOY_HOOK secret it will
      # also poke Cloudflare directly. Without the secret it quietly does nothing.
      - name: Nudge Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: curl -sS -X POST "$HOOK" && echo "deploy hook sent"
